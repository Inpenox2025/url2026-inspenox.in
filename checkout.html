<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <title>Checkout - INJARA LMS</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Injara LMS by Inspenox is an intelligent learning management system for colleges with coding practice, placement preparation, and assessments.">
    <link rel="canonical" href="https://inspenox.in/products/lms/" />
    <meta property="og:title" content="Injara LMS - AI Powered Learning Management System">
    <meta property="og:description"
        content="Injara LMS is a next-generation AI-powered learning management system for colleges and training institutes.">
    <meta property="og:url" content="https://inspenox.in/products/lms/">
    <meta property="og:type" content="website">
    <script type="application/ld+json">
             {
               "@context": "https://schema.org",
               "@type": "SoftwareApplication",
               "name": "INJARA LMS",
               "applicationCategory": "EducationalApplication",
               "operatingSystem": "Web",
               "description": "INJARA LMS is an AI-powered learning management system developed by Inspenox for colleges, training institutes and enterprises.",
               "url": "https://inspenox.in/products/lms/",
               "creator": {
               "@type": "Organization",
               "name": "Inspenox Pvt Ltd"
              }
            }
          </script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="../assets/css/styles.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet" />
    <!-- Favicon -->
    <link rel="shortcut icon" href="../assets/images/favicon.png" type="image/x-icon" />
    <link rel="icon" href="../assets/images/favicon.png" type="image/x-icon" />

    <!-- Your Global Styles -->
    <link href="./assets/css/styles.css" rel="stylesheet">

    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <!-- STYLE -->
    <style>
        .checkout-card {
            backdrop-filter: blur(18px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .checkout-card:hover {
            transform: translateY(-5px);
        }

        [data-bs-theme="light"] .checkout-card {
            background: #ffffff;
        }

        .plan-box {
            padding: 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, #00c6ff20, #0072ff20);
        }

        .price-box {
            padding: 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
        }

        [data-bs-theme="light"] .price-box {
            background: #f8f9fa;
        }

        .total-highlight {
            color: #00c6ff;
        }

        /* Gradient Button */
        .btn-gradient {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border: none;
            color: white;
        }

        /* Pay Button */
        .btn-pay {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border: none;
            transition: 0.3s;
        }

        .btn-pay:hover {
            transform: scale(1.03);
        }

        /* Coupon feedback */
        #couponStatus.success {
            color: #28a745;
        }

        #couponStatus.error {
            color: #ff4d4f;
        }

        .coupon-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
            z-index: 9999;
        }

        .coupon-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* LOADER OVERLAY */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .loader-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .loader-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px 40px;
            border-radius: 16px;
        }
    </style>

</head>

<body>

    <!-- Navbar -->
    <nav id="navbar" class="navbar navbar-expand-lg navbar-dark transparent fixed-top">
        <div class="container d-flex align-items-center">
            <a class="navbar-brand d-flex align-items-center" href="../index.html">
                <img id="siteLogo" src="../assets/images/dark11.png" data-dark="../assets/images/dark11.png"
                    data-light="../assets/images/light11.png" alt="Inspenox Logo" class="me-2"
                    style="height: 80px; width: auto" />
            </a>

            <!-- Spacer to push toggles to the right -->
            <div class="ms-auto d-flex align-items-center">
                <!-- Mobile Theme Toggle -->
                <button class="theme-toggle-button d-lg-none me-2" onclick="toggleTheme()" id="themeToggleBtnMobile"
                    aria-label="Toggle theme">
                    <i class="bi" id="themeToggleIconMobile"></i>
                </button>

                <!-- Hamburger Menu Toggle -->
                <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="toggler-icon top-bar"></span>
                    <span class="toggler-icon middle-bar"></span>
                    <span class="toggler-icon bottom-bar"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../products/lms.html#plans">Plans</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://lms.inspenox.in/" target="_blank">Login</a>
                    </li>
                </ul>
                <!-- Desktop-only Toggle + Get Demo -->
                <div class="d-none d-lg-flex align-items-center gap-2 ms-3">
                    <button class="theme-toggle-button" onclick="toggleTheme()" id="themeToggleBtnDesktop"
                        aria-label="Toggle theme">
                        <i class="bi" id="themeToggleIconDesktop"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <!-- CHECKOUT SECTION -->
    <section class="py-5 mt-5">
        <div class="container">

            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8 col-12">

                    <div class="checkout-card p-4 rounded-4">

                        <h3 class="text-center fw-bold mb-4">
                            Complete Your Purchase
                        </h3>

                        <!-- PLAN -->
                        <div class="plan-box mb-3 text-center">
                            <h4 id="planName"></h4>
                            <p class="text-muted">Annual Subscription</p>
                        </div>

                        <!-- PRICE DETAILS -->
                        <div class="price-box">

                            <div class="d-flex justify-content-between">
                                <span>Base Price</span>
                                <span>₹<span id="basePrice"></span></span>
                            </div>

                            <!--<div class="d-flex justify-content-between">
                               <span>GST (18%)</span>
                                <span>₹<span id="gst"></span></span>
                            </div>-->

                            <hr>

                            <div class="d-flex justify-content-between fw-bold fs-5">
                                <span>Total</span>
                                <span>₹<span id="total"></span></span>
                            </div>

                        </div>

                        <!-- COUPON -->
                        <div class="mt-3">
                            <input type="text" id="coupon" class="form-control" placeholder="Enter Coupon Code">
                            <button class="btn btn-outline-primary w-100 mt-2" onclick="applyCoupon()">
                                Apply Coupon
                            </button>
                        </div>

                        <!-- USER DETAILS -->
                        <div class="mt-4">

                            <h5 class="fw-bold mb-3">User Details</h5>

                            <input type="text" id="fullName" class="form-control mb-2" placeholder="Full Name" required>

                            <input type="email" id="email" class="form-control mb-2" placeholder="Email Address"
                                readonly>

                            <input type="tel" id="mobile" class="form-control mb-2" placeholder="Mobile Number"
                                required>

                            <small class="text-muted">
                                📌 Your <b>Email</b> and <b>Mobile Number</b> will be used as login credentials after
                                successful payment.
                            </small>

                        </div>

                        <!-- PAY BUTTON -->
                        <button class="btn btn-theme w-100 mt-4 py-2" onclick="payNow()">
                            Pay Now 🚀
                        </button>

                    </div>

                </div>
            </div>

        </div>
    </section>

    <!-- COUPON MODAL -->
    <div class="modal fade" id="couponModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4">

                <div class="modal-body text-center p-4">
                    <div id="modalIcon" class="mb-3"></div>

                    <h5 id="modalTitle" class="fw-bold"></h5>
                    <p id="modalMessage" class="text-muted mb-3"></p>

                    <button class="btn btn-theme px-4" data-bs-dismiss="modal">
                        OK
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- LOADER -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-box text-center">
            <div class="spinner-border text-info mb-3" role="status"></div>
            <h5 id="loaderText">Please wait...</h5>
        </div>
    </div>

    <!-- Bootstrap JS (REQUIRED FOR MODALS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


    <script>
        const params = new URLSearchParams(window.location.search);

        const email = params.get("email") || localStorage.getItem("user_email");
        const name = params.get("name") || localStorage.getItem("user_name");

        // Autofill
        if (email) {
            document.getElementById("email").value = email;
        }

        if (name) {
            document.getElementById("fullName").value = name;
        }

        if (!email) {
            document.body.innerHTML = "<h3>Please login with Google first</h3>";
        }

        const PLAN_PRICES = {
            core: 2999,
            plus: 4499,
            elite: 6999
        };

        const plan = params.get("plan");
        let basePrice = PLAN_PRICES[plan];

        document.getElementById("planName").innerText = plan.toUpperCase() + " PLAN";

        const CONFIG = {
            GST_PERCENT: 0,
            PLATFORM_FEE_PERCENT: 2,
            COUPONS: {
                "INJARA76": 99.98,
                // "SAVE10": 10
            }
        };

        let discountPercent = 0;
        let finalTotal = 0;

        // ===============================
        // 💰 CALCULATE TOTAL
        // ===============================
        function calculateTotal() {

            const gst = (basePrice * CONFIG.GST_PERCENT) / 100;
            const platformFee = (basePrice * CONFIG.PLATFORM_FEE_PERCENT) / 100;

            let subtotal = basePrice + gst + platformFee;

            const discountAmount = (subtotal * discountPercent) / 100;
            const total = subtotal - discountAmount;

            // Base price update
            document.getElementById("basePrice").innerText = basePrice.toFixed(2);

            // ===============================
            // 🔥 REMOVE OLD GST ROW ALWAYS
            // ===============================
            const oldGST = document.getElementById("gstRow");
            if (oldGST) oldGST.remove();

            // ===============================
            // ✅ ADD GST ONLY IF > 0
            // ===============================
            if (CONFIG.GST_PERCENT > 0) {

                const row = document.createElement("div");
                row.className = "d-flex justify-content-between";
                row.id = "gstRow";
                row.innerHTML = `
            <span>GST (${CONFIG.GST_PERCENT}%)</span>
            <span>₹${gst.toFixed(2)}</span>
        `;

                document.querySelector(".price-box")
                    .insertBefore(row, document.querySelector(".price-box hr"));
            }

            // ===============================
            // PLATFORM FEE ROW
            // ===============================
            if (!document.getElementById("platformFeeRow")) {
                const row = document.createElement("div");
                row.className = "d-flex justify-content-between";
                row.id = "platformFeeRow";
                row.innerHTML = `
            <span>Platform Fee (${CONFIG.PLATFORM_FEE_PERCENT}%)</span>
            <span>₹<span id="platformFee"></span></span>
        `;
                document.querySelector(".price-box")
                    .insertBefore(row, document.querySelector(".price-box hr"));
            }

            document.getElementById("platformFee").innerText = platformFee.toFixed(2);

            // ===============================
            // REMOVE OLD DISCOUNT
            // ===============================
            const oldDiscount = document.getElementById("discountRow");
            if (oldDiscount) oldDiscount.remove();

            // ===============================
            // ADD DISCOUNT
            // ===============================
            if (discountPercent > 0) {
                const row = document.createElement("div");
                row.className = "d-flex justify-content-between text-success";
                row.id = "discountRow";
                row.innerHTML = `
            <span>Discount (${discountPercent}%)</span>
            <span>- ₹${discountAmount.toFixed(2)}</span>
        `;
                document.querySelector(".price-box")
                    .insertBefore(row, document.querySelector(".price-box hr"));
            }

            document.getElementById("total").innerText = total.toFixed(2);

            finalTotal = total;
            return total;
        }

        // Initial load
        calculateTotal();

        // ===============================
        // 🎟️ APPLY COUPON
        // ===============================
        function applyCoupon() {

            const input = document.getElementById("coupon").value.trim();

            showLoader("Applying coupon...");

            fetch("/.netlify/functions/apply-coupon", {
                method: "POST",
                body: JSON.stringify({ coupon: input })
            })
                .then(res => res.json())
                .then(data => {

                    if (data.valid) {
                        discountPercent = data.discount;

                        // 🎉 CONFETTI BLAST
                        confetti({
                            particleCount: 120,
                            spread: 80,
                            origin: { y: 0.6 }
                        });

                        // Optional: multiple bursts for premium feel
                        setTimeout(() => {
                            confetti({
                                particleCount: 80,
                                spread: 100,
                                origin: { y: 0.7 }
                            });
                        }, 200);

                        showModal(
                            "success",
                            "Coupon Applied 🎉",
                            `${discountPercent}% discount applied`
                        );
                    } else {
                        discountPercent = 0;

                        showModal(
                            "error",
                            "Invalid Coupon ❌",
                            "Coupon not found"
                        );
                    }

                    calculateTotal();
                })
                .finally(() => hideLoader());
        }

        // ===============================
        // 💳 PAYMENT
        // ===============================


        function payNow() {

            const name = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const coupon = document.getElementById("coupon").value;
            localStorage.setItem("user_mobile", mobile);

            if (!name || !email || !mobile) {
                alert("Please fill all user details");
                return;
            }

            showLoader("Creating secure payment...");

            fetch("/.netlify/functions/create-order", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    plan: plan,
                    coupon: coupon,
                    name: name,
                    email: email,
                    mobile: mobile
                })
            })
                .then(res => res.json())
                .then(data => {

                    hideLoader(); // hide before Razorpay opens

                    const options = {
                        key: "rzp_live_SWiS28f7BcJLXD",
                        amount: data.amount,
                        currency: "INR",
                        name: "INJARA LMS",
                        description: plan + " Plan",
                        order_id: data.order_id,

                        prefill: {
                            name: name,
                            email: email,
                            contact: mobile
                        },

                        handler: function (response) {

                            showLoader("Verifying payment...");

                            fetch("/.netlify/functions/verify-payment", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify(response)
                            })
                                .then(res => res.json())
                                .then(data => {

                                    if (data.success) {

                                        showLoader("Redirecting...");

                                        setTimeout(() => {
                                            window.location.href = `success.html?order_id=${response.razorpay_order_id}&payment_id=${response.razorpay_payment_id}&plan=${plan}&amount=${finalTotal}&email=${email}&name=${name}&mobile=${mobile}`;
                                        }, 1200);

                                    } else {
                                        hideLoader();
                                        alert("Payment verification failed!");
                                    }

                                });

                        }
                    };

                    new Razorpay(options).open();
                })
                .catch(() => {
                    hideLoader();
                    alert("Something went wrong!");
                });
        }

        // ===============================
        // 🎯 MODAL FUNCTION
        // ===============================
        function showModal(type, title, message) {

            const icon = document.getElementById("modalIcon");
            const modalTitle = document.getElementById("modalTitle");
            const modalMessage = document.getElementById("modalMessage");

            modalTitle.innerText = title;
            modalMessage.innerText = message;

            if (type === "success") {
                icon.innerHTML = '<i class="bi bi-check-circle-fill text-success fs-1"></i>';
            } else {
                icon.innerHTML = '<i class="bi bi-x-circle-fill text-danger fs-1"></i>';
            }

            const modal = new bootstrap.Modal(document.getElementById('couponModal'));
            modal.show();

            if (type === "success") {
                setTimeout(() => modal.hide(), 2000);
            }
        }

        function showLoader(text = "Please wait...") {
            const loader = document.getElementById("loaderOverlay");
            document.getElementById("loaderText").innerText = text;
            loader.classList.add("show");
        }

        function hideLoader() {
            const loader = document.getElementById("loaderOverlay");
            loader.classList.remove("show");
        }

    </script>

    <!-- YOUR EXISTING SCRIPT -->
    <script src="./assets/js/script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Influencer Dashboard | Inspenox</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            transition: 0.4s;
        }

        html[data-bs-theme="dark"] body {
            background: linear-gradient(to bottom right, #020810, #081428);
            color: #fff;
        }

        html[data-bs-theme="light"] body {
            background: linear-gradient(135deg, #ffffff, #e6f0ff);
            color: #111;
        }

        .navbar {
            backdrop-filter: blur(10px);
        }

        .card-ui {
            border-radius: 18px;
            padding: 25px;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.3s;
        }

        .card-ui:hover {
            transform: translateY(-5px);
        }

        [data-bs-theme="light"] .card-ui {
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .btn-theme {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 25px;
        }

        .table thead {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: white;
        }

        .theme-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
        }

        .navbar img {
            height: 50px;
        }

        @media (max-width: 576px) {
            .navbar .container {
                flex-wrap: nowrap;
            }

            .navbar img {
                height: 40px;
            }

            .btn-danger {
                font-size: 12px;
                padding: 4px 8px;
            }

            .theme-btn {
                width: 35px;
                height: 35px;
            }
        }

        @media (max-width: 326px) {
            .navbar .container {
                flex-wrap: nowrap;
            }

            .navbar img {
                height: 25px;
            }

            .btn-danger {
                font-size: 12px;
                padding: 4px 8px;
            }

            .theme-btn {
                width: 35px;
                height: 35px;
            }
        }

        .card-ui {
            border-radius: 16px;
            padding: 18px;
        }

        @media (max-width: 576px) {
            .card-ui {
                padding: 14px;
            }
        }

        h2 {
            font-size: 28px;
        }

        h6 {
            font-size: 14px;
        }

        @media (max-width: 576px) {
            h2 {
                font-size: 22px;
            }

            h4 {
                font-size: 18px;
            }

            h6 {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark fixed-top">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="../index.html">
                <img id="siteLogo" src="../assets/images/dark11.png" data-dark="../assets/images/dark11.png"
                    data-light="../assets/images/light11.png" alt="Inspenox Logo" class="me-2"
                    style="height: 80px; width: auto" /> </a>

            <div class="d-flex gap-2">

                <button class="theme-btn" onclick="toggleTheme()">
                    <i class="bi" id="themeIcon"></i>
                </button>

                <button class="btn btn-danger btn-sm" onclick="logout()">
                    Logout
                </button>

            </div>

        </div>
    </nav>

    <!-- CONTENT -->
    <div class="container" style="margin-top:120px">

        <h4 class="fw-bold mb-4">Dashboard</h4>

        <!-- STATS -->
        <div class="row g-4">

            <div class="col-md-3">
                <div class="card-ui text-center">
                    <h6>Total Sales</h6>
                    <h2 id="sales">0</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card-ui text-center">
                    <h6>Total Commission</h6>
                    <h2 id="commission">₹0</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card-ui text-center">
                    <h6>Paid Amount</h6>
                    <h2 id="paid">₹0</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card-ui text-center">
                    <h6>Pending Balance</h6>
                    <h2 id="pending">₹0</h2>
                </div>
            </div>

        </div>

        <!-- TABLE -->
        <div class="card-ui mt-4">

            <h6 class="mb-3">Order History</h6>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Plan</th>
                            <th>Amount</th>
                            <th>Commission</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="table"></tbody>
                </table>
            </div>

        </div>

    </div>

    <script>

        // 🔐 SESSION CHECK
        const email = sessionStorage.getItem("inf_email");

        if (!email) {
            window.location.replace("influencer-login.html");
        }

        // 🚫 BACK BLOCK
        window.history.pushState(null, null, window.location.href);
        window.onpopstate = function () {
            window.location.replace("influencer-login.html");
        };

        // 🌗 THEME
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute("data-bs-theme");
            const newTheme = current === "dark" ? "light" : "dark";
            html.setAttribute("data-bs-theme", newTheme);
            localStorage.setItem("theme", newTheme);
            updateIcon();
        }

        function updateIcon() {
            const theme = document.documentElement.getAttribute("data-bs-theme");
            document.getElementById("themeIcon").className =
                theme === "dark" ? "bi bi-sun-fill" : "bi bi-moon-fill";
        }

        (function () {
            const saved = localStorage.getItem("theme") || "dark";
            document.documentElement.setAttribute("data-bs-theme", saved);
            updateIcon();
        })();

        // 💰 FORMATTER
        function formatCurrency(val) {
            return "₹" + Number(val || 0).toFixed(2);
        }

        // 📊 FETCH DASHBOARD
        fetch("/.netlify/functions/get-dashboard", {
            method: "POST",
            body: JSON.stringify({ email })
        })
            .then(res => res.json())
            .then(data => {

                // STATS
                document.getElementById("sales").innerText = data.totalSales;
                document.getElementById("commission").innerText = formatCurrency(data.totalCommission);
                document.getElementById("paid").innerText = formatCurrency(data.paidAmount);
                document.getElementById("pending").innerText = formatCurrency(data.pendingBalance);

                // TABLE
                let html = "";

                data.orders.forEach(o => {

                    const status = o.payout_status || "pending";

                    const badge = status === "paid"
                        ? `<span class="badge bg-success">Paid</span>`
                        : `<span class="badge bg-warning text-dark">Pending</span>`;

                    html += `
                    <tr>
                        <td>${o.order_id}</td>
                        <td>${o.plan_name}</td>
                        <td>${formatCurrency(o.final_amount)}</td>
                        <td>${formatCurrency(o.commission_amount)}</td>
                        <td>${badge}</td>
                    </tr>`;
                });

                document.getElementById("table").innerHTML = html;

            });

        // 🔐 LOGOUT
        function logout() {
            sessionStorage.clear();
            window.location.replace("influencer-login.html");
        }

        // 🚫 CACHE FIX
        window.onpageshow = function (event) {
            if (event.persisted) {
                window.location.reload();
            }
        };

    </script>

    <script src="../assets/js/script.js"></script>


</body>

</html>
